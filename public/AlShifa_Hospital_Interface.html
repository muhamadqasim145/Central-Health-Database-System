<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al Shifa Hospital</title>
<link rel="icon" type="image/png" href="/chds-logo.png">
<style>
:root{--ink:#12233a;--muted:#55657a;--card:rgba(255,255,255,.8);--line:#d9e2ee;--accent:#1f4fd8;--accent2:#6aa6ff;--bg:#eef4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body[data-role=LAB]{--accent:#0b8f7f;--accent2:#5fd6c3;--bg:#e9faf6}
html{height:100%}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;transition:background .8s;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;background:var(--accent2);animation:fl 14s ease-in-out infinite;transition:background .8s}
.o1{width:380px;height:380px;left:-80px;top:-60px}.o2{width:320px;height:320px;right:-60px;top:30%;background:var(--accent);opacity:.3;animation-delay:-5s}.o3{width:300px;height:300px;left:30%;bottom:-120px;animation-delay:-9s}
@keyframes fl{50%{transform:translate(40px,-50px) scale(1.15)}}
.stage{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding:24px;perspective:900px}
.card{width:min(100%,420px);position:relative;overflow:hidden;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff;border-radius:24px;padding:26px;box-shadow:0 30px 70px -20px rgba(18,35,58,.35);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s,opacity .5s;animation:in .8s cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.85),transparent 60%)}
.card>*{position:relative}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.96)}}
.card.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.card.out{opacity:0;transform:translateY(-30px) scale(.95)}
.ecg{width:100%;height:44px}
.ecg path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ecg .t{opacity:.15}.ecg .r{stroke-dasharray:.3 1;animation:run 2.2s linear infinite}
@keyframes run{from{stroke-dashoffset:.3}to{stroke-dashoffset:-1}}
h1{margin:6px 0 2px;font-size:26px;letter-spacing:-.3px}.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:12px}
input,textarea,select{display:block;width:100%;margin-top:5px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px;color:var(--ink);background:#fff;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{height:80px;resize:vertical}
.enc{background:#0f1f33;color:#9ff0d4;border-radius:12px;padding:10px 12px;font-size:12px;margin:2px 0 12px}
.enc b{display:block;color:#fff;font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;opacity:.85}
.enc code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.er{color:#c0392b;font-size:13px;min-height:18px;margin:0 0 8px}
.go{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--accent);cursor:pointer;box-shadow:0 12px 24px -10px var(--accent);transition:transform .15s,background .6s}
.go:hover{transform:translateY(-2px)}.go:active{transform:scale(.98)}
.sp{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
.sp.dk{border-color:rgba(0,0,0,.15);border-top-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
#welcome{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:36px 22px 60px;animation:in .8s}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{background:var(--accent);color:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700}
h2{margin:10px 0 0;font-size:30px}
.lo{border:1.5px solid var(--accent);color:var(--accent);background:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 0}
.nav button{border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s}
.nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hd{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 8px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding:22px;border-radius:20px;color:#fff;background:linear-gradient(120deg,var(--accent),#0a4f66);position:relative;overflow:hidden;animation:in .7s}
.hero::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);animation:shine 3.5s infinite}
@keyframes shine{to{left:130%}}
.hero p{margin:0;opacity:.9;font-size:13px}.hero h3{margin:4px 0 0;font-size:22px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.w{background:#fff;color:var(--accent);position:relative;z-index:1}
.btn.o{background:#fff;color:var(--accent);border:1.5px solid var(--accent);margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.st,.list,.form{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #fff;border-radius:18px}
.st{padding:18px;opacity:0;transform:translateY(20px);animation:up .6s forwards}
.st b{display:block;font-size:34px;color:var(--accent)}.st span{font-size:13px;color:var(--muted)}
@keyframes up{to{opacity:1;transform:none}}
.list{padding:4px 16px}
.rq{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(12px);animation:up .5s forwards}
.rq:last-child{border:0}.rt{min-width:0;flex:1}
.mt{color:var(--muted);font-size:13px;margin:3px 0 6px}
.bd{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#fff0d6;color:#9a5b00}
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding:16px;background:var(--card);border:1px solid #fff;border-radius:18px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bar i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--accent2),var(--accent));transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes gr{from{transform:scaleY(0)}}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.qa button{padding:16px;border:1.5px solid var(--line);background:#fff;border-radius:14px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;transition:all .25s}
.qa button:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 24px -12px var(--accent)}
.form{padding:20px;margin-top:18px;animation:up .5s both}
.pg{height:8px;background:#e3e8ee;border-radius:6px;overflow:hidden;margin:0 0 12px}.pg i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.cipher{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:#0f1f33;color:#9ff0d4;border-radius:10px;padding:8px 10px}
.res{margin-top:10px;padding:10px 12px;border-radius:10px;background:#eafaf1;color:#14532d;font-size:14px}
.pv,.rimg{max-width:100%;max-height:300px;border:1px solid var(--line);border-radius:10px;margin:4px 0 12px}
.rpdf{width:100%;height:420px;border:1px solid var(--line);border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#12233a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:9;animation:up .4s forwards;opacity:0;max-width:90%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.st,.rq{opacity:1;transform:none}}
</style>
</head>
<body data-role="DOCTOR">
<div class="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<main class="stage" id="login">
 <div class="card" id="card">
  <svg class="ecg" viewBox="0 0 300 44" preserveAspectRatio="none"><path class="t" pathLength="1" d="M0 24H70L82 24L92 6L104 40L114 14L122 24H300"/><path class="r" pathLength="1" d="M0 24H70L82 24L92 6L104 40L114 14L122 24H300"/></svg>
  <h1>Al Shifa Hospital</h1>
  <p class="sub">Healing with care, every day</p>
  <label>Username<input id="u" autocomplete="off"></label>
  <label>Password<input id="p" type="password"></label>
  <div class="enc"><b>How your data looks once encrypted</b><code id="enc">waiting for input...</code></div>
  <p class="er" id="err"></p>
  <button class="go" id="go">Sign in</button>
 </div>
</main>
<section id="welcome" hidden></section>
<script>
const $=s=>document.querySelector(s),B=document.body,c=$("#card");
const U={"lab.sara":{r:"LAB",n:"Sara"},"dr.ahmed":{r:"DOCTOR",n:"Dr. Ahmed"},"ali.raza":{r:"PATIENT",n:"Ali Raza"}};
const ch="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789+/";
const rnd=n=>{let s="";for(let i=0;i<n;i++)s+=ch[Math.random()*ch.length|0];return s};
const tm=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
function sample(p,t,lines){const x=(s,y,z,b)=>`<text x='24' y='${y}' font-size='${z}' font-family='Arial' ${b?"font-weight='bold'":""}>${s}</text>`;
 return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='520' height='320'><rect width='100%' height='100%' fill='white' stroke='#999'/>${x("Al Shifa Hospital - Laboratory",44,20,1)}${x("Patient: "+p,80,14)}${x("Test: "+t,104,14)}${lines.map((l,i)=>x(l,150+i*28,15)).join("")}</svg>`)}
let REQ=[{id:1,p:"Ali Raza",t:"Complete Blood Count (CBC)",d:"Dr. Ahmed",dt:"11 Oct 2026"},{id:2,p:"Ayesha Khan",t:"Blood Sugar (Fasting)",d:"Dr. Ahmed",dt:"11 Oct 2026"},{id:3,p:"Sana Malik",t:"Platelet Count",d:"Dr. Ahmed",dt:"10 Oct 2026"}];
let REP=[{id:1,p:"Usman Tariq",t:"Lipid Profile",dt:"09 Oct 2026",name:"lipid_usman.svg",type:"image/svg+xml",data:sample("Usman Tariq","Lipid Profile",["Total Cholesterol: 182 mg/dL","HDL: 52 mg/dL","LDL: 110 mg/dL"]),note:"All values within normal range."},
{id:2,p:"Ali Raza",t:"Blood Group",dt:"08 Oct 2026",name:"bloodgroup_ali.svg",type:"image/svg+xml",data:sample("Ali Raza","Blood Group",["Blood Group: B Positive"]),note:"Blood group B positive."}];
REP.forEach(r=>r.c=rnd(44));
let LOG=[],usr,tab="dash",viewId=0,dec=false,pre=0,pend=null,ck;
const setRole=r=>{B.dataset.role=r};
function enc(){const n=$("#u").value.length+$("#p").value.length;let s="";for(let i=0;i<n*2+14;i++)s+=ch[Math.random()*ch.length|0];$("#enc").textContent=n?"ENC:"+s:"waiting for input..."}
$("#u").oninput=enc;$("#p").oninput=enc;
c.onmousemove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 c.style.setProperty("--ry",(x-.5)*10+"deg");c.style.setProperty("--rx",(.5-y)*10+"deg");c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%")};
c.onmouseleave=()=>{c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")};
$("#go").onclick=()=>{const u=$("#u").value.trim().toLowerCase(),p=$("#p").value,g=$("#go"),er=$("#err"),x=U[u];er.textContent="";
 if(!u||!p){er.textContent="Enter your username and password";return}
 if(!x||p!=="test1234"){c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");er.textContent="Wrong username or password";return}
 g.disabled=true;g.innerHTML='<i class="sp"></i> Checking with server';
 setTimeout(()=>{g.textContent="Role found: "+({LAB:"Lab",DOCTOR:"Doctor",PATIENT:"Patient"})[x.r];setRole(x.r)},1000);
 setTimeout(()=>c.classList.add("out"),1900);
 setTimeout(()=>{usr=x;tab=x.r=="LAB"?"dash":"rep";$("#login").hidden=true;$("#welcome").hidden=false;view()},2400)};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
const em=m=>`<div class="rq" style="animation-delay:.1s"><span>${m}</span></div>`;
function go(k){tab=k;viewId=0;pend=null;view()}
function cnt(){document.querySelectorAll("#welcome b[data-n]").forEach(b=>{const n=+b.dataset.n;let k=0;if(!n){b.textContent=0;return}const t=setInterval(()=>{k=Math.min(n,k+Math.max(1,Math.ceil(n/25)));b.textContent=k;if(k>=n)clearInterval(t)},35)})}
function reps(list){const v=REP.find(r=>r.id==viewId);
 return `<div class="list">${list.map((r,i)=>`<div class="rq" style="animation-delay:${i*.08}s"><div class="rt"><b>${r.t}</b><div class="mt">${r.p} · ${r.dt} · ${r.name}</div>${viewId==r.id&&!dec?"":`<div class="cipher">ENC:${r.c}</div>`}</div><div><button class="btn" onclick="opn(${r.id})">${viewId==r.id?"Close":"View"}</button><button class="btn o" onclick="dl(${r.id})">Download</button></div></div>`).join("")||em("No reports yet")}</div>`+
 (v&&list.includes(v)?(dec?`<div class="form"><i class="sp dk"></i> Decrypting report...</div>`:`<div class="form"><b>${v.t} · ${v.p}</b><div style="margin-top:10px">${v.type.startsWith("image")?`<img class="rimg" src="${v.data}">`:`<iframe class="rpdf" src="${v.data}"></iframe><p class="mt">If the PDF does not show, use Download.</p>`}</div>${v.note?`<div class="res">${v.note}</div>`:""}</div>`):"")}
function view(){
 const w=$("#welcome"),top=`<div class="top"><div><span class="chip">${({LAB:"Lab Portal",DOCTOR:"Doctor Portal",PATIENT:"Patient Portal"})[usr.r]}</span><h2>Welcome, ${usr.n}</h2></div><button class="lo" onclick="location.reload()">Log out</button></div>`;
 if(usr.r=="DOCTOR"){w.innerHTML=top+`<div class="form"><b>Doctor home page</b><p style="color:var(--muted)">Built by my teammate. The doctor requests lab tests and reads the reports here.</p></div>`;return}
 if(usr.r=="PATIENT"){w.innerHTML=top+`<p class="hd">My lab reports</p><p class="mt">Your reports are stored encrypted and decrypted only when you open one.</p>`+reps(REP.filter(r=>r.p==usr.n));return}
 const T=[["dash","Dashboard"],["req","Requests"],["up","Upload report"],["rep","Reports"],["log","Access log"]];
 let h=top+`<div class="nav">${T.map(t=>`<button class="${t[0]==tab?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</div>`;
 if(tab=="dash"){const rc=LOG.filter(l=>l.a.startsWith("Viewed")).length,W=[6,9,7,12,10,4,REP.length+3],M=Math.max(...W);
  h+=`<div class="hero"><div><p>Today · <span id="clk"></span></p><h3>${REQ.length?REQ.length+" requests waiting for reports":"All requests are completed"}</h3></div>${REQ.length?`<button class="btn w" onclick="go('req')">Review now</button>`:""}</div>
  <div class="stats">${[["Pending requests",REQ.length],["Reports uploaded",REP.length],["Reports viewed",rc],["Encrypted files",REP.length]].map((s,i)=>`<div class="st" style="animation-delay:${i*.12}s"><b data-n="${s[1]}">0</b><span>${s[0]}</span></div>`).join("")}</div>
  <p class="hd">Tests this week</p><div class="chart">${W.map((v,i)=>`<div class="bar"><i style="height:${v/M*100}%;animation-delay:${i*.08}s"></i><span>${"MTWTFSS"[i]}</span></div>`).join("")}</div>
  <p class="hd">Quick actions</p><div class="qa">${[["req","Review requests"],["up","Upload report"],["rep","Open reports"],["log","Access log"]].map(a=>`<button onclick="go('${a[0]}')">${a[1]}</button>`).join("")}</div>`}
 if(tab=="req")h+=`<p class="hd">Test requests from doctors</p><div class="list">${REQ.map((r,i)=>`<div class="rq" style="animation-delay:${i*.08}s"><div class="rt"><b>${r.t}</b><span class="bd">PENDING</span><div class="mt">${r.p} · Requested by ${r.d} · ${r.dt}</div></div><button class="btn" onclick="pre=${r.id};go('up')">Upload report</button></div>`).join("")||em("No pending requests")}</div>`;
 if(tab=="up")h+=REQ.length?`<div class="form"><label>Test request<select id="sel">${REQ.map(r=>`<option value="${r.id}" ${r.id==pre?"selected":""}>${r.p} · ${r.t}</option>`).join("")}</select></label><label>Lab report (photo or PDF)<input type="file" id="fl" accept="image/*,.pdf" onchange="pick(this)"></label><p class="mt">On a phone you can take a photo of the printed report. Maximum 5 MB.</p><div id="pv"></div><label>Result summary (optional)<textarea id="nt" placeholder="e.g. Hemoglobin 13.2 g/dL"></textarea></label><div class="enc"><b>Encryption</b><code id="co">File is encrypted on the server before saving</code></div><div class="pg"><i id="pb"></i></div><p class="er" id="e2"></p><button class="go" id="ub" onclick="upl()">Encrypt and upload</button></div>`:`<div class="form">No pending requests.</div>`;
 if(tab=="rep")h+=`<p class="hd">Uploaded reports</p>`+reps(REP);
 if(tab=="log")h+=`<p class="hd">Who accessed reports</p><div class="list">${LOG.map((l,i)=>`<div class="rq" style="animation-delay:${i*.05}s"><span>${l.u} · ${l.r}</span><span class="mt">${l.a} · ${l.t}</span></div>`).join("")||em("No activity yet. Open a report to see it logged here.")}</div>`;
 w.innerHTML=h;
 if(tab=="dash"){cnt();const e=()=>{const x=$("#clk");if(x)x.textContent=new Date().toLocaleTimeString()};e();clearInterval(ck);ck=setInterval(e,1000)}}
function opn(id){if(viewId==id){viewId=0;view();return}
 viewId=id;dec=true;view();const r=REP.find(x=>x.id==id);
 setTimeout(()=>{dec=false;LOG.unshift({u:usr.n,r:r.t+" - "+r.p,a:"Viewed (decrypted)",t:tm()});view()},700)}
function dl(id){const r=REP.find(x=>x.id==id),a=document.createElement("a");a.href=r.data;a.download=r.name;a.click();LOG.unshift({u:usr.n,r:r.t+" - "+r.p,a:"Downloaded",t:tm()});toast("Report downloaded")}
function pick(i){const f=i.files[0];pend=null;$("#e2").textContent="";if(!f)return;
 if(f.size>5*1024*1024){$("#e2").textContent="File is larger than 5 MB";i.value="";return}
 const rd=new FileReader();rd.onload=()=>{pend={name:f.name,type:f.type,data:rd.result};$("#pv").innerHTML=f.type.startsWith("image")?`<img class="pv" src="${rd.result}">`:`<p class="mt">Selected file: ${f.name}</p>`};rd.readAsDataURL(f)}
function upl(){if(!pend){$("#e2").textContent="Please choose the report photo or PDF";return}
 const r=REQ.find(x=>x.id==$("#sel").value),nt=$("#nt").value.trim(),f=pend;
 $("#e2").textContent="";$("#ub").disabled=true;let k=0;
 const t=setInterval(()=>{k+=8;$("#pb").style.width=Math.min(k,100)+"%";$("#co").textContent="ENC:"+rnd(40);
  if(k>=108){clearInterval(t);REP.unshift({id:Date.now(),p:r.p,t:r.t,dt:new Date().toLocaleDateString([],{day:"2-digit",month:"short",year:"numeric"}),name:f.name,type:f.type,data:f.data,note:nt,c:rnd(44)});
   REQ=REQ.filter(x=>x.id!=r.id);LOG.unshift({u:usr.n,r:r.t+" - "+r.p,a:"Uploaded (encrypted)",t:tm()});
   pend=null;pre=0;toast("Report encrypted and uploaded. The doctor and patient can now open it.");go("rep")}},90)}
</script>
</body>
</html>
